[project]
name = "instant"
version = "0.1.0"
description = "A Django single-app template with an agent-driven edit/deploy loop"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1,<6.2",
    "django-allauth[socialaccount]>=65.11.2", # OAuth and social login
    "django-ninja>=1.6.2", # API scaffolding
    "gitpython>=3.1", # /git viewer reads the project repo
    "granian>=2.5", # Rust ASGI server (VM prod serving; see deploy/)
    "huey>=2.5", # Redis-backed background tasks + cron (RedisHuey via the existing redis dep)
    "inertia-django>=2.0.0", # Inertia.js backend (v3 protocol)
    "nh3>=0.2.21", # HTML sanitization
    "psycopg2-binary>=2.9.10", # Postgres driver
    "pydantic>=2.11.10",
    "python-dateutil>=2.9.0.post0",
    "structlog>=26.1",
    "redis>=5.0",
    "types-python-dateutil>=2.9.0.20260124",
    "django-stubs[compatible-mypy]>=6.1.0,<6.2",
    "mypy>=2.3.1,<2.4",
    "django-stubs-ext>=6.1.0,<6.2",
]

[dependency-groups]
dev = [
    "coverage>=7.10.7",
    "playwright>=1.40",
    "ruff>=0.15.0",
    "time-machine>=3.5.0",
]

[tool.uv]
# Relative cutoff: only releases from the last 7 days are eligible
exclude-newer = "P7D"

[tool.ruff]
# Explicit (not .gitignore-based) so the same config works in a gitless scratch/
# (see ./run createscratch) as in main/ — node_modules/.venv/build output are not source.
exclude = [
  ".venv",
  ".git",
  ".kilo",
  "djangoapp/migrations",
  "ourapp/migrations",
  "node_modules",
  "dist",
  "build",
  "djangoapp/static",
  "docs/reference",
  "djangoapp/tests/testapp",
]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # Trailing comma missing (conflicts with formatter)
    "D100",  # undocumented-public-module
    "D101",  # undocumented-public-class
    "D102",  # undocumented-public-method
    "D103",  # undocumented-public-function
    "D104",  # undocumented-public-package
    "D106",  # Missing docstring in public nested class
    "D107",  # undocumented-public-init
    "D203",  # 1 blank line required before class docstring (incompatible with D211)
    "D213",  # Multi-line docstring summary should start at the second line (incompatible with D212)
    "DJ008",  # django-model-without-dunder-str
    "ERA001", # commented-out-code
    "FIX002",  # line-contains-todo
    "PT009", # Use a regular `assert` instead of unittest-style `assert*`
    "PT027", # Use `pytest.raises` instead of unittest-style `assertRaises`
    "S101",  # assert
    "S106", # Hardcoded password
    "SIM108", # if-else-block-instead-of-if-exp
    "TC006", # runtime-cast-value
    "TD002",  # missing-todo-author
    "TD003",  # missing-todo-link
    "TD004",  # missing-todo-colon
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately reach into private fields and compare against literal
# status codes / pagination counts that read better as numbers than named consts.
"djangoapp/tests/**/*.py" = [
    "PLR2004",  # magic values (404/200/422, page sizes, totals) are idiomatic in tests
    "SLF001",  # tests assert on private fields/managers that have no public accessor
]
# Third-party-shaped stubs - mirror external library APIs (Any returns, camelCase names).
"stubs/**/*.pyi" = [
    "ANN401",  # stubbed return types are Any
    "N802",  # third-party API names cannot be renamed
    "N818",  # exception names mirror the library
]
# deploy/ holds executable tooling, not an importable package.
"deploy/**/*.py" = [
    "INP001",  # deploy/ is a scripts directory, deliberately not a package
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 200
ignore-overlong-task-comments = true

[tool.ruff.format]
exclude = [".venv"]

[tool.mypy]
strict = true
# Local PEP 561 stub overlays (stubs/huey; the inertia ones went away with
# inertia-django 2.0 shipping py.typed).
mypy_path = "stubs"
# Each exclude is a directory that isn't part of the type-checked app code:
exclude = [
  "docs/reference/",  # reference example apps used only in documentation
  "djangoapp/tests/testapp/",  # synthetic test-app fixture, not app source
  "node_modules/",  # frontend deps (only stray .py, never ours)
  "dist/",  # frontend build output
  "build/",  # packaging/build artifacts
  ".kilo/",  # kilo editor review worktrees (snapshots, not source)
]
warn_unused_ignores = true
warn_unreachable = true  # flag dead branches strict mode doesn't cover
disallow_any_unimported = true
disallow_any_decorated = true
disallow_any_generics = true
plugins = ["mypy_django_plugin.main"]

# Per-module typing policy. Importing a third-party package that ships no
# py.typed is an *error* by default (so a new untyped dep can't sneak in
# unnoticed); packages that legitimately lack stubs are allow-listed here.
[[tool.mypy.overrides]]
module = ["allauth.*"]
ignore_missing_imports = true

# inertia-django 2.0 ships py.typed, but its inertia.test helpers are untyped
# internals; our test suites call them everywhere, so tests opt out of
# untyped-call strictness (production code stays strict).
[[tool.mypy.overrides]]
module = ["djangoapp.tests.*", "ourapp.tests.*"]
disallow_untyped_calls = false


[tool.django-stubs]
django_settings_module = "djangoproject.settings"
