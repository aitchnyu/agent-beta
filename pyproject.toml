[project]
name = "instant"
version = "0.1.0"
description = "A Django single-app template with an agent-driven edit/deploy loop"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0",
    "django-allauth[socialaccount]>=65.11.2", # OAuth and social login
    "django-ninja>=1.6.2", # API scaffolding
    "gitpython>=3.1", # /git viewer reads the project repo
    "httpx>=0.28", # talks to the local opencode daemon
    "inertia-django>=1.2.0", # Inertia.js backend
    "nh3>=0.2.21", # HTML sanitization
    "psycopg2-binary>=2.9.10", # Postgres driver
    "pydantic>=2.11.10",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.1",
    "types-python-dateutil>=2.9.0.20260124",
]

[dependency-groups]
dev = [
    "coverage>=7.10.7",
    "django-stubs[compatible-mypy]>=6.0.2",
    "mypy>=1.20",
    "playwright>=1.40",
    "ruff>=0.13.2",
]

[tool.uv]
exclude-newer = "7 days"

[tool.ruff]
# Explicit (not .gitignore-based) so the same config works in a gitless copy/
# (see ./run createscratch) as in main/ — node_modules/.venv/build output are not source.
exclude = [
  ".venv",
  ".git",
  "djangoapp/migrations",
  "ourapp/migrations",
  "prevproject",
  "node_modules",
  "dist",
  "build",
  "djangoapp/static",
  "docs/reference",
  "djangoapp/tests/testapp",
]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # Trailing comma missing (conflicts with formatter)
    "D100",  # undocumented-public-module
    "D101",  # undocumented-public-class
    "D102",  # undocumented-public-method
    "D103",  # undocumented-public-function
    "D104",  # undocumented-public-package
    "D106",  # Missing docstring in public nested class
    "D107",  # undocumented-public-init
    "D203",  # 1 blank line required before class docstring (incompatible with D211)
    "D213",  # Multi-line docstring summary should start at the second line (incompatible with D212)
    "DJ008",  # django-model-without-dunder-str
    "ERA001", # commented-out-code
    "FIX002",  # line-contains-todo
    "PT009", # Use a regular `assert` instead of unittest-style `assert*`
    "PT027", # Use `pytest.raises` instead of unittest-style `assertRaises`
    "S101",  # assert
    "S106", # Hardcoded password
    "SIM108", # if-else-block-instead-of-if-exp
    "TC006", # runtime-cast-value
    "TD002",  # missing-todo-author
    "TD003",  # missing-todo-link
    "TD004",  # missing-todo-colon
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately reach into private fields and compare against literal
# status codes / pagination counts that read better as numbers than named consts.
"djangoapp/tests/**/*.py" = [
    "PLR2004",  # magic values (404/200/422, page sizes, totals) are idiomatic in tests
    "SLF001",  # tests assert on private fields/managers that have no public accessor
]
# Third-party-shaped stubs - mirror external library APIs (Any returns, camelCase names).
"stubs/**/*.pyi" = [
    "ANN401",  # stubbed return types are Any
    "N802",  # third-party API names cannot be renamed
    "N818",  # exception names mirror the library
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 200
ignore-overlong-task-comments = true

[tool.ruff.format]
exclude = [".venv"]

[tool.mypy]
strict = true
# aihere explain why excludes are there
exclude = ["prevproject/", "docs/reference/", "djangoapp/tests/testapp/", "node_modules/", "dist/", "build/"]
warn_unused_ignores = true
disallow_any_unimported = true
disallow_any_decorated = true
disallow_any_generics = true
plugins = ["mypy_django_plugin.main"]
disable_error_code = ["import-untyped"]

[tool.django-stubs]
django_settings_module = "djangoproject.settings"
