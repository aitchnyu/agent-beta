{% load app_static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}Instant{% endblock %}</title>
        <link rel="stylesheet" href="{{ '/static/djangoapp/main.css'|hashed_entry }}">
        {% block inertia_head %}{% endblock %}
        {% block head_extra %}{% endblock %}
    </head>
    <body>
        {% csrf_token %}
        {% block inertia %}{% endblock %}
        <script type="module" src="{{ '/static/djangoapp/main.js'|hashed_entry }}"></script>
    </body>
</html>
